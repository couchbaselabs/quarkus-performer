name: Publish FIT performer images

# One-off build for quarkus-couchbase 1.4.1. The SDK 3.10.1 performer sources are committed.
#
# Builds the Quarkus FIT performer against one quarkus-couchbase ref and publishes two images:
#   ghcr.io/<owner>/quarkus-fit-performer:<tag>         JVM mode
#   ghcr.io/<owner>/quarkus-native-fit-performer:<tag>  native mode (Mandrel)
#
# The image tag follows the FIT performer image conventions in
# https://github.com/couchbaselabs/sdk-docker-build-action, based on the quarkus-couchbase ref.

run-name: quarkus-couchbase ${{ inputs.quarkus_couchbase_ref }}

on:
  workflow_dispatch:
    inputs:
      quarkus_couchbase_ref:
        description: "quarkus-couchbase ref: a tag like '1.4.2', a branch like 'main', a full commit hash, or a PR ref like 'refs/pull/244/head'"
        required: true
        type: string
      extra_tag:
        description: "Optional extra image tag to push as well"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.quarkus_couchbase_ref }}
  cancel-in-progress: true

env:
  QUARKUS_COUCHBASE_REPO: quarkiverse/quarkus-couchbase
  GRPCURL_VERSION: 1.9.4
  # The wrapper pins Maven, so older quarkus-couchbase tags still build on the runner.
  MVN: ${{ github.workspace }}/mvnw

jobs:
  publish:
    name: Build & publish (${{ matrix.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: jvm
            image: quarkus-fit-performer
            maven_args: ""
          - mode: native
            image: quarkus-native-fit-performer
            maven_args: "-Dnative -Dquarkus.native.container-build=true"

    steps:
      - name: Check out quarkus-performer
        uses: actions/checkout@v4

      - name: Check out quarkus-couchbase
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QUARKUS_COUCHBASE_REPO }}
          ref: ${{ inputs.quarkus_couchbase_ref }}
          path: quarkus-couchbase

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compute image tag
        shell: bash
        env:
          REF: ${{ inputs.quarkus_couchbase_ref }}
        run: |
          TAG="$REF"
          if [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            TAG="sha-${TAG:0:12}"
          elif [[ "$TAG" =~ ^v[0-9] ]]; then
            TAG="${TAG#v}"
          elif [[ "$TAG" = "master" ]]; then
            TAG="main"
          fi
          TAG="${TAG//\//-}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "QUARKUS_COUCHBASE_SHA=$(git -C quarkus-couchbase rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Build quarkus-couchbase
        run: $MVN -B --no-transfer-progress -f quarkus-couchbase/pom.xml install -DskipTests

      - name: Read versions
        shell: bash
        run: |
          eval_prop() { $MVN -q -f pom.xml help:evaluate -Dexpression="$1" -DforceStdout; }
          echo "SDK_VERSION=$(eval_prop couchbase-client.version)" >> "$GITHUB_ENV"
          echo "QUARKUS_VERSION=$(eval_prop quarkus.platform.version)" >> "$GITHUB_ENV"

      - name: Build the performer
        run: $MVN -B --no-transfer-progress clean package -DskipTests ${{ matrix.maven_args }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.IMAGE_TAG }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ env.QUARKUS_COUCHBASE_SHA }}
            com.couchbase.github.actions.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            com.couchbase.quarkus-couchbase.ref=${{ inputs.quarkus_couchbase_ref }}
            com.couchbase.quarkus-performer.revision=${{ github.sha }}
            com.couchbase.java-sdk.version=${{ env.SDK_VERSION }}
            com.couchbase.quarkus.version=${{ env.QUARKUS_VERSION }}
            com.couchbase.performer.mode=${{ matrix.mode }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.${{ matrix.mode }}
          build-args: QUARKUS_COUCHBASE_VERSION=${{ env.IMAGE_TAG }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check the image starts and serves gRPC
        shell: bash
        run: |
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl
          docker run -d --name performer -p 8060:8060 "$IMAGE:$IMAGE_TAG"
          timeout 60 bash -c 'until docker logs performer 2>&1 | grep -q "started in"; do sleep 1; done'
          grpcurl -plaintext -max-time 30 -import-path src/main/proto -proto performer.proto -d '{}' \
            localhost:8060 protocol.PerformerService/performerCapsFetch | grep "libraryVersion.*+quarkus-couchbase.$IMAGE_TAG"

      - name: Show performer logs
        if: failure()
        run: docker logs performer || true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the image
        shell: bash
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          if [ -n "$EXTRA_TAG" ]; then
            docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$EXTRA_TAG"
            docker push "$IMAGE:$EXTRA_TAG"
          fi
          PINNED=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG")
          {
            echo "### ${{ matrix.mode }}"
            echo "- 🔖 \`$IMAGE:$IMAGE_TAG\`"
            if [ -n "$EXTRA_TAG" ]; then echo "- 🔖 \`$IMAGE:$EXTRA_TAG\`"; fi
            echo "- 📌 \`$PINNED\`"
            echo "- Java SDK $SDK_VERSION, Quarkus $QUARKUS_VERSION, quarkus-couchbase \`${{ inputs.quarkus_couchbase_ref }}\` ($QUARKUS_COUCHBASE_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"
