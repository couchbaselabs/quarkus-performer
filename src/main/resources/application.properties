quarkus.couchbase.username=Administrator
quarkus.couchbase.password=password
quarkus.couchbase.connection-string=couchbase://localhost
quarkus.devservices.enabled=false
quarkus.grpc.server.port=8060
quarkus.grpc.server.use-separate-server=true
quarkus.application.name=quarformer

quarkus.generate-code.grpc.scan-for-imports=all

# The performer reads the SDK version from these files at runtime. A native image leaves them out unless listed.
quarkus.native.resources.includes=com/couchbase/client/java/version.properties,com/couchbase/client/core/version.properties
